server {
    listen 80;
    server_name _;

    # STT audio uploads are capped at 50MB by the backend; Excel imports can
    # also be sizeable. 100M leaves headroom without being unbounded.
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Plain health check for docker-compose / Portainer, independent of the
    # backend being reachable.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Reverse proxy to the backend service (Docker network hostname "backend").
    # apiClient.js on the frontend already calls same-origin "/api/*" paths --
    # this is the reverse-proxy side of that design, replacing the old IIS
    # URL Rewrite rule.
    location /api/ {
        proxy_pass http://backend:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router client-side routing: fall back to index.html for any
    # path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
