server {
    listen 80;
    server_name _;

    # Docker's own HEALTHCHECK (see Dockerfile) hits this directly over plain
    # HTTP from inside the container's own network namespace -- exempted from
    # the HTTPS redirect below (nginx matches this exact "=" location before
    # the catch-all) so the healthcheck never needs to speak TLS to a
    # self-signed cert it has no reason to trust.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else: HTTPS is required here, not optional -- getUserMedia()
    # (the browser mic API used for Speech-to-Text) refuses to run on a
    # non-localhost origin unless the page is served over a secure context.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Generated per-deployment by scripts/generate_certificate.sh (see
    # release engineering docs) and mounted read-only -- never baked into
    # this image, since a cert baked at build time would be pinned to
    # whatever host happened to build it, not the actual deployment target.
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # STT audio uploads are capped at 50MB by the backend; Excel imports can
    # also be sizeable. 100M leaves headroom without being unbounded.
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Reverse proxy to the backend service (Docker network hostname "backend").
    # apiClient.js on the frontend already calls same-origin "/api/*" paths --
    # this is the reverse-proxy side of that design, replacing the old IIS
    # URL Rewrite rule. Deliberately still plain HTTP to the backend container
    # (internal Docker network, not the public path) -- only the browser-facing
    # origin needs TLS for the secure-context requirement above.
    location /api/ {
        proxy_pass http://backend:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Router client-side routing: fall back to index.html for any
    # path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
